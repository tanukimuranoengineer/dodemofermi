<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ｜どうでもフェルミ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <p class="back"><a href="./">← どうでもフェルミ サポート</a></p>
  <h1>お問い合わせ</h1>
  <p>不具合や、お題の答え・出典の間違いに気づいたら教えてください。返信が必要なときは、返信先のメールアドレスを書いてください。</p>

  <form id="contact">
    <label for="kind">お問い合わせの種類（必須）</label>
    <select id="kind" name="kind" required>
      <option value="不具合">不具合</option>
      <option value="お題の答えや出典の間違い">お題の答えや出典の間違い</option>
      <option value="その他">その他</option>
    </select>

    <label for="body">内容（必須・2,000文字まで）</label>
    <textarea id="body" name="body" rows="8" maxlength="2000" required></textarea>

    <label for="reply">返信先のメールアドレス（任意）</label>
    <input id="reply" name="reply" type="email" maxlength="200" autocomplete="email">

    <!-- 機械的な送信をはじくための欄。人には見えない -->
    <input class="trap" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

    <button type="submit">送る</button>
    <p id="status" role="status"></p>
  </form>

  <p class="note">送った内容は、<a href="privacy.html">プライバシーポリシー</a>のとおりに扱います。</p>
</main>
<script>
  // 送り先は、アプリと同じ Supabase。公開してよい鍵（publishable key）なので、ページに書いてよい
  const URL_BASE = 'https://bhignxlqkhqznhgvdcvi.supabase.co';
  const KEY = 'sb_publishable_CVAefvKxSYT1Xu8H8nAbhg_yB5RQ37B';
  const form = document.getElementById('contact');
  const status = document.getElementById('status');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (form.website.value) return;
    const button = form.querySelector('button');
    button.disabled = true;
    status.textContent = '送っています…';
    try {
      const res = await fetch(URL_BASE + '/rest/v1/contact_messages', {
        method: 'POST',
        headers: { apikey: KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify({
          kind: form.kind.value,
          body: form.body.value.trim(),
          reply_to: form.reply.value.trim() || null,
        }),
      });
      if (!res.ok) throw new Error(String(res.status));
      form.reset();
      status.textContent = '送りました。ありがとうございます。';
    } catch {
      status.textContent = '送れませんでした。時間をおいて、もう一度ためしてください。';
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
